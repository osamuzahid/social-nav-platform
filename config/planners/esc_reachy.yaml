# Reachy + Isaac names for the hospital ESC hop (domain 0 with keepalive).
# Same recipe as esc_stretch.yaml. Platform overlays only:
#   laser_scan_frame / point_cloud_frame: lidar_link (Stretch is laser)
#   robot_base_radius: 0.25 (must match nav2_reachy_params.yaml)
#   planning_bounds cover hospital.yaml origin [-12.5,-35] extent ~25×56 m.
# Mapper/planner/controller subscribe RELIABLE; live /odom and /scan are
# BEST_EFFORT — run qos_relay.py so these *_esc topics exist.
#
# Offline hospital.bt is walls from hospital.png (same as occupancy A* #78).
# USD stretchers are not in that PNG — do not paint them. Live /scan still
# inserts into the OcTree (Humble-devel used to skip laser when a .bt was
# set → 8 m stretcher chord). People also arrive via hunav_to_pedsim.
#
# Goto2D action server is commented out. Goals: PoseStamped query_goal.

esc_move_base_control:
  ros__parameters:
    use_sim_time: true
    max_vel: 0.35
    min_vel: 0.05
    max_turn_rate: 0.7
    min_turn_rate: 0.2
    controller_hz: 20.0
    odometry_topic: /odom_esc
    control_path_topic: /esc_move_base_planner/esc_move_base_solution_path
    control_output_topic: /cmd_vel
    control_active_topic: /control_active_topic
    xy_goal_tolerance: 0.25

world_modeler_node:
  ros__parameters:
    use_sim_time: true
    resolution: 0.05
    map_frame: map
    fixed_frame: odom
    robot_frame: base_link
    odometry_topic: /odom_esc
    visualize_free_space: false
    rviz_timer: 1.0
    mapping_max_range: 8.0
    # Set on the Isaac launch CLI to tools/esc_isaac/maps/hospital.bt.
    offline_octomap_path: ""
    point_cloud_topic: /unused_depth
    point_cloud_frame: lidar_link
    laser_scan_topic: /scan_esc
    laser_scan_frame: lidar_link
    social_agents_topic: /pedsim_simulator/simulated_agents
    social_agent_radius: 0.4
    social_relevance_validity_checking: false
    robot_distance_view_max: 8.0
    robot_distance_view_min: 1.5
    robot_angle_view: 1.57
    robot_velocity_threshold: 0.35

online_planning_framework:
  ros__parameters:
    use_sim_time: true
    world_frame: map
    planner_name: RRTstar
    planning_bounds_x: [-15.0, 15.0]
    planning_bounds_y: [-40.0, 25.0]
    dynamic_bounds: true
    timer_period: 1.0
    solving_time: 0.9
    opport_collision_check: true
    reuse_last_best_solution: true
    optimization_objective: ExtendedSocialComfort
    motion_cost_interpolation: false
    xy_goal_tolerance: 0.25
    visualize_tree: false
    robot_base_radius: 0.25
    odometry_topic: /odom_esc
    query_goal_topic: /esc_move_base_planner/query_goal
    goto_action: /esc_goto_action
    solution_path_topic: /esc_move_base_planner/esc_move_base_solution_path
    grid_map_service: /get_grid_map
    erase_map_topic: /esc_move_base_mapper/erase_map
